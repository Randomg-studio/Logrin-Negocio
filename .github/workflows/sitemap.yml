# Actualiza sitemap.xml de Mi Mercadito una vez al día con las tiendas y productos públicos.
name: Mapa del sitio

on:
  schedule:
    - cron: '17 9 * * *'   # 4:17 a. m. de Perú
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generar sitemap.xml
        run: node .github/scripts/sitemap.mjs
      - name: Guardar si cambió
        run: |
          if git diff --quiet -- sitemap.xml; then echo "Nada que guardar."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Actualizar sitemap.xml de Mi Mercadito"
          git push
